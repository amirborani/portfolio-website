<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amir Borani | Creative Studio</title>

<meta name="description"
content="Amir Borani — Video Editor, Content Creator, Web Designer, Programmer, AI Enthusiast and Streamer">

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Inter',sans-serif;

    background:
        radial-gradient(circle at 20% 10%,rgba(157,123,32,.08),transparent 25%),
        radial-gradient(circle at 80% 90%,rgba(0,0,0,.05),transparent 30%),
        #f6f3ec;

    color:#111;

    overflow-x:hidden;
}


/* =====================================
   GOLD PARTICLES
===================================== */

.particles{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-5;

    overflow:hidden;
}

.particles span{

    position:absolute;

    width:4px;
    height:4px;

    background:#9d7b20;

    border-radius:50%;

    opacity:.35;

    animation:floatParticle 8s linear infinite;
}

.particles span:nth-child(1){
    left:10%;
    top:80%;
    animation-delay:0s;
}

.particles span:nth-child(2){
    left:20%;
    top:40%;
    animation-delay:2s;
}

.particles span:nth-child(3){
    left:35%;
    top:70%;
    animation-delay:4s;
}

.particles span:nth-child(4){
    left:50%;
    top:30%;
    animation-delay:1s;
}

.particles span:nth-child(5){
    left:65%;
    top:75%;
    animation-delay:3s;
}

.particles span:nth-child(6){
    left:80%;
    top:45%;
    animation-delay:5s;
}

.particles span:nth-child(7){
    left:90%;
    top:20%;
    animation-delay:2s;
}

@keyframes floatParticle{

    0%{
        transform:translateY(0) scale(1);
        opacity:.1;
    }

    50%{
        opacity:.5;
    }

    100%{
        transform:translateY(-120px) scale(1.5);
        opacity:0;
    }
}


/* =====================================
   NAVIGATION
===================================== */

nav{

    position:fixed;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    width:min(1150px,92%);

    padding:15px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:rgba(255,255,255,.78);

    backdrop-filter:blur(20px);

    border:1px solid rgba(0,0,0,.12);

    border-radius:20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.12),
        inset 0 1px #fff;

    z-index:1000;
}

.logo{

    font-family:'Cinzel',serif;

    font-size:21px;

    font-weight:800;

    color:#111;

    text-decoration:none;
}

.logo span{
    color:#a38327;
}

nav ul{

    list-style:none;

    display:flex;

    gap:26px;
}

nav a{

    color:#333;

    text-decoration:none;

    font-size:12px;

    font-weight:700;

    transition:.3s;
}

nav a:hover{
    color:#a38327;
}


/* =====================================
   MAIN FRAME
===================================== */

.page{

    position:relative;

    width:min(1180px,93%);

    margin:120px auto 60px;

    background:rgba(255,254,249,.95);

    border:3px solid #111;

    border-radius:30px;

    overflow:hidden;

    box-shadow:

        14px 14px 0 #111,

        25px 35px 70px rgba(0,0,0,.18),

        inset 0 0 80px rgba(157,123,32,.035);
}


/* Inner luxury frame */

.page::before{

    content:"";

    position:absolute;

    inset:13px;

    border:1px solid rgba(157,123,32,.4);

    border-radius:21px;

    pointer-events:none;

    z-index:10;
}


/* =====================================
   DRAGON FRAME
===================================== */

.dragon-frame{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    padding:20px;

    pointer-events:none;

    z-index:1;

    opacity:.12;

    overflow:visible;

    filter:
        drop-shadow(8px 12px 6px rgba(0,0,0,.25));

    animation:dragonMove 8s ease-in-out infinite;
}

@keyframes dragonMove{

    0%,100%{
        transform:scale(1);
        opacity:.10;
    }

    50%{
        transform:scale(1.008);
        opacity:.15;
    }
}


/* =====================================
   CHINESE CORNERS
===================================== */

.corner{

    position:absolute;

    font-family:Georgia,serif;

    font-size:90px;

    color:#111;

    opacity:.15;

    z-index:4;

    pointer-events:none;
}

.corner.tl{
    top:5px;
    left:15px;
}

.corner.tr{
    top:5px;
    right:15px;
    transform:scaleX(-1);
}

.corner.bl{
    bottom:5px;
    left:15px;
    transform:scaleY(-1);
}

.corner.br{
    bottom:5px;
    right:15px;
    transform:scale(-1);
}


/* =====================================
   HERO
===================================== */

.hero{

    min-height:720px;

    padding:120px 30px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    position:relative;

    z-index:5;
}

.hero-content{

    max-width:900px;

    animation:heroEnter 1.2s ease;
}

@keyframes heroEnter{

    from{

        opacity:0;

        transform:
            translateY(40px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.crest{

    font-size:30px;

    color:#a38327;

    letter-spacing:12px;

    margin-bottom:25px;
}

.hero h1{

    font-family:'Cinzel',serif;

    font-size:clamp(55px,9vw,110px);

    line-height:.9;

    letter-spacing:4px;

    margin-bottom:30px;

    color:#111;

    text-shadow:

        2px 2px 0 #d4cfc4,

        5px 7px 0 rgba(0,0,0,.08);
}

.hero h1 span{
    color:#a38327;
}

.hero h2{

    font-family:'Cinzel',serif;

    font-size:clamp(16px,3vw,27px);

    color:#333;

    margin-bottom:25px;
}

.hero p{

    max-width:720px;

    margin:auto;

    color:#747474;

    line-height:1.9;

    font-size:15px;
}


/* =====================================
   BUTTONS
===================================== */

.buttons{
    margin-top:38px;
}

.btn{

    display:inline-block;
